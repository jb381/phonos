[project]
name = "phonos-server"
version = "0.1.0"
description = "Local Whisper transcription server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0.0",
    "pydantic-settings>=2.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.26.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
