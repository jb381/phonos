services:
  phonos:
    build: .
    container_name: phonos-server
    ports:
      - "${PHONOS_BIND:-127.0.0.1}:${PHONOS_PORT:-8765}:8765"
    environment:
      - PHONOS_HOST=0.0.0.0
      - PHONOS_PORT=8765
      - PHONOS_AUTH_TOKEN=${PHONOS_AUTH_TOKEN:-}
      - PHONOS_MODEL=${PHONOS_MODEL:-base.en}
      - PHONOS_MODELS=${PHONOS_MODELS:-tiny.en,base.en,small.en,medium.en}
      - PHONOS_DEVICE=${PHONOS_DEVICE:-cpu}
      - PHONOS_COMPUTE_TYPE=${PHONOS_COMPUTE_TYPE:-int8}
      - PHONOS_VAD_FILTER=${PHONOS_VAD_FILTER:-true}
    volumes:
      - phonos_models:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  phonos_models:
