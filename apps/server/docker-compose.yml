services:
  phonos:
    build: .
    container_name: phonos-server
    ports:
      - "${PHONOS_BIND:-0.0.0.0}:${PHONOS_PORT:-8765}:${PHONOS_PORT:-8765}"
    environment:
      - PHONOS_PORT=${PHONOS_PORT:-8765}
      - PHONOS_AUTH_TOKEN=${PHONOS_AUTH_TOKEN:-}
      - PHONOS_MODEL=${PHONOS_MODEL:-base.en}
      - PHONOS_MODELS=${PHONOS_MODELS:-tiny.en,base.en,small.en,medium.en,large-v3,turbo,distil-large-v3}
      - PHONOS_DEVICE=${PHONOS_DEVICE:-cpu}
      - PHONOS_COMPUTE_TYPE=${PHONOS_COMPUTE_TYPE:-int8}
      - PHONOS_VAD_FILTER=${PHONOS_VAD_FILTER:-true}
      - PHONOS_TRANSCRIBE_TIMEOUT_SECONDS=${PHONOS_TRANSCRIBE_TIMEOUT_SECONDS:-600}
      - PHONOS_MAX_UPLOAD_MB=${PHONOS_MAX_UPLOAD_MB:-100}
    volumes:
      - phonos_models:/root/.cache/huggingface
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"PHONOS_PORT\"]}/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  phonos_models:
