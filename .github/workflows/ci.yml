name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv run pytest

      - run: uv run ruff check .

  swift:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6

      - run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Phonos-macOS
          path: apps/macos/Phonos.dmg

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: apps/macos/Phonos.dmg
          generate_release_notes: true
