name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv run pytest -m "not e2e"

      - run: uv run ruff check .

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv run pytest -m e2e
        timeout-minutes: 15

  swift:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: swift test
        env:
          CI: "true"

      - run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Phonos-macOS
          path: apps/macos/Phonos.dmg

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: apps/macos/Phonos.dmg
          generate_release_notes: true
