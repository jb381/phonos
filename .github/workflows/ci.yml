name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv run pytest

      - run: uv run ruff check .

  swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6

      - run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Phonos-macOS
          path: apps/macos/Phonos.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Phonos-macOS

      - name: Tagged version
        id: tagged
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename DMG with version
        run: mv Phonos.dmg "Phonos-${{ steps.tagged.outputs.version }}.dmg"

      - uses: softprops/action-gh-release@v2
        with:
          files: Phonos-*.dmg
          generate_release_notes: true
