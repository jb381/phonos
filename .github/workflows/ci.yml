name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv run pytest -m "not e2e"

      - name: Audit dependencies for CVEs
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: apps/server/uv.lock

      - run: uv run ruff check .

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv run pytest -m e2e
        timeout-minutes: 15

  server-image:
    runs-on: ubuntu-latest
    needs: [python, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jb381/phonos-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      # Build first, scan for CVEs, then push — never publish a vulnerable image
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          exit-code: 1
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Push image to registry
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  swift:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # KeychainStore tests are skipped by default because Keychain access in
      # unsigned CI test binaries is unreliable and can block the test runner.
      # They remain manual tests run locally with PHONOS_TEST_KEYCHAIN=1.
      - run: swift test
        env:
          CI: "true"

      - run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Phonos-macOS
          path: apps/macos/Phonos.dmg

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: apps/macos/Phonos.dmg
          generate_release_notes: true
